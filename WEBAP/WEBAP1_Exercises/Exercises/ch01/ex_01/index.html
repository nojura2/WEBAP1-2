<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Exercise 1.1</title>
    <link rel="stylesheet" href="../../../assets/exercise.css" />
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#buttons [data-selector]").on("click", function () {
          // clear();
          $(this.dataset.selector).css("background-color", "yellow");
        });
        $("#reset").on("click", reset);
        function reset() {
          $("#page *").css("background-color", "");
        }
      });
    </script>
  </head>
  <body>
    <h2>Exercise 1.1 – Selectors</h2>
    <div id="buttons">
      <button data-selector="p">$("p")</button>
      <button data-selector="#left">$("#left")</button>
      <button data-selector="#left p">$("#left p")</button>
      <button data-selector=".special">$(".special")</button>
      <button data-selector="p.special">$("p.special")</button>
      <button data-selector="div#right p.special">
        $("div#right p.special")
      </button>
      <button data-selector="#page p">$("#page p")</button>
      <button data-selector="#page &gt; p">$("#page &gt; p")</button>
      <button id="reset">Reset</button>
    </div>
    <div id="page">
      <h1>Welcome</h1>
      <div id="left">
        <p>Paragraph A</p>
        <p class="special">Paragraph B</p>
      </div>
      <div id="right">
        <p class="special">Paragraph C</p>
        <p>Paragraph D</p>
      </div>
      <div class="special">
        <p>Paragraph E</p>
      </div>
    </div>
  </body>
</html>
